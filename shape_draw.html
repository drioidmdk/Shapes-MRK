<!DOCTYPE html>

<!-- Basic HTML page -->
<html>

<head>

<!-- Load TensorFlow.js library -->
<!-- This allows JavaScript to run neural networks -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<title>Shape Recognition Demo</title>

</head>

<body>

<!-- Page title -->
<h2>Draw a Shape v2.2</h2>
<p>
Draw a circle, square, or triangle using one continuous line.
Tap "Predict Shape" to see the result.
</p>
<!-- Drawing canvas -->
<!-- width and height define drawing area -->
<canvas id="canvas"
        width="96"
        height="96"
        style="border:1px solid black">
</canvas>

<br><br>

<button onclick="predictShape()" style="font-size:18px; padding:10px;">
Predict Shape
</button>

<button onclick="clearCanvas()" style="font-size:18px; padding:10px;">
Clear
</button>

<br><br>

<!-- Where prediction result appears -->
<p id="result">
Prediction will appear here
</p>

<script>

let drawing = false;
let lastX = 0;
let lastY = 0;

// ----------------------------
// Canvas Setup
// ----------------------------

let canvas =
    document.getElementById("canvas");

let ctx =
    canvas.getContext("2d");

// Fill background black
ctx.fillStyle = "black";

ctx.fillRect(
    0,
    0,
    96,
    96
);

ctx.imageSmoothingEnabled = false;


// Track drawing state




// ----------------------------
// Get pointer position
// Works for mouse OR touch
// ----------------------------

function getPosition(e) {

    let rect = canvas.getBoundingClientRect();

    let x, y;

    if (e.touches) {

        x = e.touches[0].clientX - rect.left;
        y = e.touches[0].clientY - rect.top;

    } else {

        x = e.offsetX;
        y = e.offsetY;

    }

    // Scale to canvas resolution
    x = x * (canvas.width / rect.width);
    y = y * (canvas.height / rect.height);

    return { x, y };
}


// ----------------------------
// Start Drawing
// ----------------------------

function startDrawing(e) {

    e.preventDefault();

    drawing = true;

    let pos = getPosition(e);

    lastX = pos.x;
    lastY = pos.y;
}


// ----------------------------
// Draw Line
// ----------------------------

function draw(e) {

    if (!drawing) return;

    e.preventDefault();

    let pos = getPosition(e);

    ctx.strokeStyle = "white";

    ctx.lineWidth = 3;

    ctx.lineCap = "round";
	ctx.lineJoin = "round";


    ctx.beginPath();

    ctx.moveTo(lastX, lastY);

    ctx.lineTo(pos.x, pos.y);

    ctx.stroke();

    lastX = pos.x;

    lastY = pos.y;
}


// ----------------------------
// Stop Drawing
// ----------------------------

function stopDrawing() {

    drawing = false;
}


// ----------------------------
// Mouse Events
// ----------------------------

canvas.addEventListener(
    "mousedown",
    startDrawing
);

canvas.addEventListener(
    "mousemove",
    draw
);

canvas.addEventListener(
    "mouseup",
    stopDrawing
);

canvas.addEventListener(
    "mouseleave",
    stopDrawing
);


// ----------------------------
// Touch Events (Mobile/iPad)
// ----------------------------

canvas.addEventListener(
    "touchstart",
    startDrawing,
    { passive:false }
);

canvas.addEventListener(
    "touchmove",
    draw,
    { passive:false }
);

canvas.addEventListener(
    "touchend",
    stopDrawing
);
// ----------------------------
// Clear Canvas Function
// ----------------------------

function clearCanvas(){

    // Fill entire canvas black
    ctx.fillStyle = "black";

    ctx.fillRect(

        0,
        0,
        96,
        96

    );

    // Reset result text
    document.getElementById("result").innerText =
        "Canvas cleared";

}

// ----------------------------
// Load Model
// ----------------------------

// Variable to hold model
let model;

// Load model from folder
async function loadModel(){

   model = await tf.loadGraphModel("tfjs_model/model.json");

    // Show ready message
    document.getElementById("result").innerText =
        "Model Loaded — Draw a Shape!";

}

// Run model loading
loadModel();


function getProcessedTensor(canvas) {

    const ctx = canvas.getContext("2d");

    let img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let data = img.data;

    // 1. grayscale + hard threshold
    for (let i = 0; i < data.length; i += 4) {

        let v = (data[i] + data[i+1] + data[i+2]) / 3;

        let bw = v;  // > 128 ? 255 : 0;

        data[i] = bw;
        data[i+1] = bw;
        data[i+2] = bw;
    }

    ctx.putImageData(img, 0, 0);

    // 2. convert to tensor
    return tf.browser.fromPixels(canvas, 1)
        .resizeNearestNeighbor([96, 96])
        .toFloat()
        .div(255.0)
        .expandDims(0);
}

function centerShape(canvas) {

    const ctx = canvas.getContext("2d");
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);

    let minX = 9999, minY = 9999;
    let maxX = 0, maxY = 0;

    for (let y = 0; y < canvas.height; y++) {
        for (let x = 0; x < canvas.width; x++) {

            let i = (y * canvas.width + x) * 4;

            if (img.data[i] > 20) {
                minX = Math.min(minX, x);
                minY = Math.min(minY, y);
                maxX = Math.max(maxX, x);
                maxY = Math.max(maxY, y);
            }
        }
    }

    let w = maxX - minX;
    let h = maxY - minY;

    let temp = document.createElement("canvas");
    temp.width = w;
    temp.height = h;

    temp.getContext("2d").putImageData(
        ctx.getImageData(minX, minY, w, h),
        0, 0
    );

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.drawImage(temp,
        0, 0, w, h,
        0, 0, canvas.width, canvas.height
    );
}



	
function preprocess(canvas) {

    const ctx = canvas.getContext("2d");

    let img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let d = img.data;

    // convert to grayscale first
    for (let i = 0; i < d.length; i += 4) {
        let v = (d[i] + d[i+1] + d[i+2]) / 3;
        d[i] = d[i+1] = d[i+2] = v;
    }

    // EDGE THINNING (critical fix)
    for (let i = 4; i < d.length - 4; i += 4) {

        let v = d[i];

        let left = d[i - 4];
        let right = d[i + 4];

        // keep only transitions (edges)
        if (Math.abs(v - left) < 10 && Math.abs(v - right) < 10) {
            d[i] = d[i+1] = d[i+2] = 0;
        }
    }

    ctx.putImageData(img, 0, 0);
}

function debugCanvas() {

    const ctx = canvas.getContext("2d");

    const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;

    let sum = 0;
    let count = 0;

    for (let i = 0; i < img.length; i += 4) {
        sum += img[i]; // red channel (grayscale anyway)
        count++;
    }

    console.log("Avg pixel intensity:", sum / count);
}

function sharpenEdges(canvas) {

    const ctx = canvas.getContext("2d");
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const d = img.data;

    for (let i = 0; i < d.length; i += 4) {

        let v = d[i];

        // boost contrast
        v = v > 120 ? 255 : 0;

        d[i] = d[i+1] = d[i+2] = v;
    }

    ctx.putImageData(img, 0, 0);
}
	
// ----------------------------
// Prediction Function
// ----------------------------

async function predictShape() {

    preprocess(canvas);     // optional but now effective
    centerShape(canvas);    // optional but now effective
	sharpenEdges(canvas);
    debugCanvas();

    const tensor = getProcessedTensor(canvas);

    const prediction = await model.predict(tensor).data();

    console.log("Prediction array:", prediction);

    const labels = ["circle", "square", "triangle"];

    const maxIndex = prediction.indexOf(Math.max(...prediction));

    document.getElementById("result").innerText =
        "Prediction: " + labels[maxIndex];

    tensor.dispose();
}
</script>

</body>

</html>
