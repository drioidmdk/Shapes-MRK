<!DOCTYPE html>

<!-- Basic HTML page -->
<html>

<head>

<!-- Load TensorFlow.js library -->
<!-- This allows JavaScript to run neural networks -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>

<title>Shape Recognition Demo</title>

</head>

<body>

<!-- Page title -->
<h2>Draw a Shape v1.12</h2>

<!-- Drawing canvas -->
<!-- width and height define drawing area -->
<canvas id="canvas"
        width="96"
        height="96"
        style="border:1px solid black">
</canvas>

<br><br>

<!-- Predict button -->
<button onclick="predictShape()">
Predict Shape
</button>

<!-- Clear button -->
<button onclick="clearCanvas()">
Clear
</button>

<br><br>

<!-- Where prediction result appears -->
<p id="result">
Prediction will appear here
</p>

<script>

// ----------------------------
// Canvas Setup
// ----------------------------

// Get canvas element
let canvas =
    document.getElementById("canvas");

// Get drawing context
let ctx =
    canvas.getContext("2d");

// Fill background black
ctx.fillStyle = "black";

ctx.fillRect(
    0,
    0,
    200,
    200
);

	ctx.imageSmoothingEnabled = false;

// Track whether mouse is drawing
let drawing = false;

// Start drawing when mouse pressed
canvas.onmousedown =
    () => drawing = true;

// Stop drawing when mouse released
canvas.onmouseup =
    () => drawing = false;

// Draw while mouse moves
canvas.onmousemove =
function(e){

    // If not drawing, stop
    if(!drawing) return;

    // Draw white pixels
    ctx.fillStyle = "white";

    ctx.beginPath();

    // Draw small circle at mouse location
    ctx.arc(

        e.offsetX,

        e.offsetY,

        10,

        0,

        Math.PI * 2

    );

    ctx.fill();

};

// ----------------------------
// Clear Canvas Function
// ----------------------------

function clearCanvas(){

    // Fill entire canvas black
    ctx.fillStyle = "black";

    ctx.fillRect(

        0,
        0,
        200,
        200

    );

    // Reset result text
    document.getElementById("result").innerText =
        "Canvas cleared";

}

// ----------------------------
// Load Model
// ----------------------------

// Variable to hold model
let model;

// Load model from folder
async function loadModel(){

   model = await tf.loadGraphModel("tfjs_model/model.json");

    // Show ready message
    document.getElementById("result").innerText =
        "Model Loaded — Draw a Shape!";

}

// Run model loading
loadModel();

function preprocessCanvas(canvas) {

    const ctx = canvas.getContext("2d");

    let img = ctx.getImageData(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < img.data.length; i += 4) {

        // convert to grayscale
        let avg =
            (img.data[i] +
             img.data[i+1] +
             img.data[i+2]) / 3;

        let val = avg > 128 ? 255 : 0;

        img.data[i] = val;
        img.data[i+1] = val;
        img.data[i+2] = val;
    }

    ctx.putImageData(img, 0, 0);
}

// ----------------------------
// Prediction Function
// ----------------------------

async function predictShape() {

	preprocessCanvas(canvas);

    const tensor = tf.browser.fromPixels(canvas, 1)
        .resizeNearestNeighbor([96, 96])
        .toFloat()
        .div(255.0)
        .expandDims(0);

    const prediction = await model.predict(tensor).data();

    console.log("Prediction:", prediction);

    const classes = ["circle", "square", "triangle"];

    const maxIndex = prediction.indexOf(Math.max(...prediction));

    document.getElementById("result").innerText =
        classes[maxIndex];

    tensor.dispose();
}

</script>

</body>

</html>
